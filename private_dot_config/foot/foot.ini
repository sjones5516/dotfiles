# Lamplit Monastery palette, matched to ~/Pictures/background.png
# Everything else uses foot's defaults (see /etc/xdg/foot/foot.ini).

[main]
font=JetBrainsMono Nerd Font:size=10

[colors-dark]
alpha=0.85
background=282828
foreground=cbc49c
cursor=282828 dad0a5
selection-foreground=dad0a5
selection-background=45403d

regular0=383534  # black
regular1=b07a6e  # red     (Ember)
regular2=a1a888  # green   (Lichen)
regular3=c9b27a  # yellow  (Ochre)
regular4=7f9396  # blue    (Slate)
regular5=a08a99  # magenta (Pilgrim)
regular6=8fa89e  # cyan    (Verdigris)
regular7=cbc49c  # white   (Parchment)

bright0=60605b   # bright black (Haze)
bright1=c4917f   # bright red
bright2=b8bd9c   # bright green
bright3=dcc690   # bright yellow
bright4=96aaad   # bright blue
bright5=b7a1af   # bright magenta
bright6=a6bfb4   # bright cyan
bright7=dad0a5   # bright white (Lamplight)
